version: '3.8'

services:
  # ---------------------------------------------------------------
  # PostgreSQL Database Service
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: procurement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: procurement_user
      POSTGRES_PASSWORD: procurement_secret_password
      POSTGRES_DB: procurement_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement_user -d procurement_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - procurement_net

  # ---------------------------------------------------------------
  # FastAPI AI Agent Backend
  # ---------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: procurement_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://procurement_user:procurement_secret_password@postgres:5432/procurement_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./demand_sample.csv:/app/demand_sample.csv
      - ./model.pkl:/app/model.pkl
    networks:
      - procurement_net

  # ---------------------------------------------------------------
  # Next.js Web Frontend
  # ---------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: procurement_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - procurement_net

networks:
  procurement_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
